<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salón Barbería Vargas - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <nav th:replace="layout :: navbar"></nav>

    <div class="container mt-4">
        <h2 class="mb-4">Panel de Control</h2>

        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card text-white bg-primary shadow-md">
                    <div class="card-body">
                        <h5 class="card-title">Citas de Hoy</h5>
                        <h2 class="display-5" th:text="${citasHoy}"></h2>
                        <p class="card-text" th:text="${citasPendientes} + ' pendientes'"></p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card text-white bg-success shadow-md">
                    <div class="card-body">
                        <h5 class="card-title">Ingresos del Día</h5>
                        <h2 class="display-5" th:text="'S/ ' + ${ingresosDia}"></h2>
                        <p class="card-text"
                            th:text="${serviciosRealizados} + ' servicios, ' + ${productosVendidos} + ' productos'"></p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card text-white bg-warning text-dark shadow-md">
                    <div class="card-body">
                        <h5 class="card-title">Stock Bajo</h5>
                        <h2 class="display-5" th:text="${stockBajo}"></h2>
                        <p class="card-text">Productos por reponer</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

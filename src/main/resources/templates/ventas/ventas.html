<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salón Barbería Vargas - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <nav th:replace="layout :: navbar"></nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Punto de Venta</h2>
        </div>

        <div class="row">
            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Agregar a la cuenta</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/ventas/agregar}" th:object="${nuevoItem}" method="post">
                            <div class="mb-4">
                                <label for="selectCliente" class="form-label">Cliente (Opcional)</label>
                                <select class="form-select" name="idClienteSeleccionado" id="selectCliente"
                                    onchange="document.getElementById('inputClienteOculto').value = this.value">
                                    <option value="" th:selected="${clienteSeleccionadoId == null}">Seleccionar o
                                        cliente de paso...</option>
                                    <option th:each="cliente : ${listaClientes}" th:value="${cliente.id}"
                                        th:selected="${clienteSeleccionadoId != null and clienteSeleccionadoId == cliente.id}"
                                        th:text="${cliente.nombreCompleto} + ' - ' + ${cliente.telefono}">
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="tipoItem" class="form-label">Tipo</label>
                                <div class="d-flex gap-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tipoItem" id="radioServicio"
                                            value="SERVICIO" checked onchange="alternarCatalogo()">
                                        <label class="form-check-label" for="radioServicio">Servicio</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tipoItem" id="radioProducto"
                                            value="PRODUCTO" onchange="alternarCatalogo()">
                                        <label class="form-check-label" for="radioProducto">Producto</label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4" id="bloqueServicios">
                                <label class="form-label">Seleccionar Servicio</label>
                                <select class="form-select" name="idServicioSeleccionado" id="selectServicio"
                                    onchange="actualizarDatosDesdeCatalogo()">
                                    <option value="" disabled selected>Elige un servicio...</option>
                                    <option th:each="srv : ${listaServicios}" th:value="${srv.id_servicio}"
                                        th:data-nombre="${srv.nombre_servicio}" th:data-precio="${srv.precio}"
                                        th:text="${srv.nombre_servicio} + ' (S/ ' + ${srv.precio} + ')'">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-4 d-none" id="bloqueProductos">
                                <label class="form-label">Seleccionar Producto</label>
                                <select class="form-select" name="idProductoSeleccionado" id="selectProducto"
                                    onchange="actualizarDatosDesdeCatalogo()">
                                    <option value="" disabled selected>Elige un producto...</option>
                                    <option th:each="prod : ${listaProductos}" th:value="${prod.id}"
                                        th:data-nombre="${prod.nombre}" th:data-precio="${prod.precio}"
                                        th:text="${prod.nombre} + ' (Stock: ' + ${prod.stock} + ' | S/ ' + ${prod.precio} + ')'">
                                    </option>
                                </select>
                            </div>

                            <input type="hidden" id="descripcion" th:field="*{descripcion}">
                            <div class="row mb-4">
                                <div class="col-4">
                                    <label class="form-label">Precio (S/)</label>
                                    <input type="number" step="0.01" class="form-control" th:field="*{precioUnitario}"
                                        readonly required>
                                </div>
                                <div class="col-4">
                                    <label class="form-label">Cantidad</label>
                                    <input type="number" class="form-control" th:field="*{cantidad}" min="1" value="1"
                                        required>
                                </div>
                                <div class="col-4 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary w-100">
                                        Agregar
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card shadow-sm border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Detalle de Cobro</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped align-middle">
                                <thead>
                                    <tr>
                                        <th>Descripción</th>
                                        <th>Cant.</th>
                                        <th>P. Unitario</th>
                                        <th>Subtotal</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${listaItems}">
                                        <td th:text="${item.descripcion}"></td>
                                        <td th:text="${item.cantidad}"></td>
                                        <td th:text="'S/ ' + ${item.precioUnitario}"></td>
                                        <td th:text="'S/ ' + ${item.subtotal}"></td>
                                        <td>
                                            <button class="btn btn-sm btn-danger" data-bs-toggle="modal"
                                                data-bs-target="#modalEliminar" th:data-id="${item.id}">
                                                Eliminar
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr class="table-success fs-5">
                                        <td colspan="3" class="text-end fw-bold">TOTAL A PAGAR:</td>
                                        <td colspan="2" class="text-center fw-bold" th:text="${totalVenta}"></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                        <div class="d-grid mt-3">
                            <form th:action="@{/ventas/registrar}" method="post">
                                <input type="hidden" name="idCliente" id="inputClienteOculto"
                                    th:value="${clienteSeleccionadoId}">
                                <button class="btn btn-success btn-lg" type="submit">
                                    Registrar y Cobrar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalEliminarLabel">Confirmar Acción</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    ¿Estás seguro de que deseas eliminar este ítem de la cuenta?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form id="formEliminar" method="post">
                        <button type="submit" class="btn btn-danger" id="btnConfirmarEliminar">Sí, eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const modalElement = document.getElementById('modalEliminar');
            const formEliminar = document.getElementById('formEliminar');
            const btnConfirmar = document.getElementById('btnConfirmarEliminar');

            modalElement.addEventListener('show.bs.modal', function (event) {
                const button = event.relatedTarget;
                const itemId = button.getAttribute('data-id');
                formEliminar.action = '/ventas/eliminar/' + itemId;
            });

            formEliminar.addEventListener('submit', () => {
                btnConfirmar.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Eliminando...';
                btnConfirmar.classList.add('disabled');
            });
        });
        function alternarCatalogo() {
            const esServicio = document.getElementById('radioServicio').checked;
            document.getElementById('bloqueServicios').classList.toggle('d-none', !esServicio);
            document.getElementById('bloqueProductos').classList.toggle('d-none', esServicio);
            document.getElementById('precioUnitario').value = '';
            document.getElementById('descripcion').value = '';
        }

        function actualizarDatosDesdeCatalogo() {
            const esServicio = document.getElementById('radioServicio').checked;
            const selectActivo = esServicio ? document.getElementById('selectServicio') : document.getElementById('selectProducto');
            const opcion = selectActivo.options[selectActivo.selectedIndex];

            if (opcion && opcion.value !== "") {
                document.getElementById('descripcion').value = opcion.getAttribute('data-nombre');
                document.getElementById('precioUnitario').value = opcion.getAttribute('data-precio');
            }
        }
    </script>
</body>

</html>

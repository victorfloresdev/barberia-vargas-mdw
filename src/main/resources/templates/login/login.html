<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Barbería Vargas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="css/style.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white text-center py-4 border-0">
                        <i class="bi bi-scissors fs-1 text-warning mb-2 d-block"></i>
                        <h4 class="fw-bold mb-1">Barbería Vargas</h4>
                        <span class="text-white-50 small">Sistema de Gestión y Control</span>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <h5 class="fw-bold text-center text-dark mb-4">Acceso al Sistema</h5>
                        <form th:action="@{/}" method="get">
                            <div class="mb-3">
                                <label for="usuario" class="form-label fw-semibold text-secondary small">Usuario o Correo</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="usuario" name="usuario"
                                        placeholder="admin@barberiavargas.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold text-secondary small">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password"
                                        placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm">
                                <i class="bi bi-box-arrow-in-right"></i>
                                <span>Ingresar al Sistema</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
